name: IMPACT-OS web verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impact-os-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      VITE_SUPABASE_URL: https://auth-fixture.invalid
      VITE_SUPABASE_ANON_KEY: synthetic-ci-value-not-a-credential
    steps:
      - name: Check out the reviewed sources without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - name: Install the unchanged lock without automatic audit or lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authentication and form regressions with mocked providers
        run: npm test -- --maxWorkers=2
      - name: Lint application and tests
        run: npm run lint
      - name: Build the complete Vite application with synthetic provider configuration
        run: npm run build
